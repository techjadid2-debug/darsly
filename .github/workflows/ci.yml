name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the run still in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # `lib/env.ts` throws at import time on a missing variable, so the
          # build needs all three set. Placeholders are enough: every route is
          # server-rendered on demand, so nothing calls Supabase during a build.
          NEXT_PUBLIC_SUPABASE_URL: https://ci.placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

  e2e:
    name: playwright
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      # The suite drives `/dev/game/[game]`, which 404s unless DARSLY_E2E is
      # set; `playwright.config.ts` starts the server with it. The Supabase
      # values are placeholders for the same reason as the build job: the
      # harness renders a template, so nothing reaches the database.
      - run: pnpm e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci.placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
